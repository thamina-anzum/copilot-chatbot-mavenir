server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location / {
    try_files $uri /index.html;
  }
  location /chat/ {
    proxy_pass http://backend:8000;
  }
  location /documents {
    proxy_pass http://backend:8000;
  }
  location /health {
    proxy_pass http://backend:8000;
  }
}
